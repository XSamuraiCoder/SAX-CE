[tool.tipy]
name = "SAXCE"
description = "SAX chat"
main = "src/main.py"
target = "ce"
bindir = "bin"

# Chat font: DrSans 7 (from the CE C toolchain's fontlibc examples), built
# into SAXFONT.8xv next to the program. y= switches to the built-in 8px font.
[[tool.tipy.assets]]
source = "fonts/drsans-07-normal.convfont"
kind = "font"
name = "SAXFONT"
