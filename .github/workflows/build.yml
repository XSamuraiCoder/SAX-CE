name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        working-directory: calc
        run: |
          pip install "tipy-asm @ git+https://github.com/XSamuraiCoder/TIpy-asm@v1.1.1"
          tipy-asm build

      - name: Pack with README.txt
        run: |
          mkdir pack
          cp calc/bin/SAXCE.8xp calc/bin/SAXFONT.8xv pack/
          sed 's/$/\r/' dist/README.txt > pack/README.txt
          (cd pack && zip -9 ../SAXCE.zip SAXCE.8xp SAXFONT.8xv README.txt)

      - name: Publish to Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest SAXCE.zip \
            --target "$GITHUB_SHA" \
            --title "Latest" \
            --notes "SAXCE built from ${GITHUB_SHA::7}. Unzip and send SAXCE.8xp and SAXFONT.8xv to your calculator; README.txt explains the rest." \
            --latest
